appId: app.wansan.studio
productName: Wansan Studio
directories:
  output: dist_electron
  buildResources: resources

files:
  - "dist/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!**/node_modules/@duckdb/duckdb-wasm/dist/*coi*"
  - "!**/node_modules/@duckdb/duckdb-wasm/dist/duckdb-browser*"
  - "!**/*.map"


# [CRITICAL] Unpack WASM and Native modules to avoid ASAR issues
asarUnpack:
  - "node_modules/@duckdb/duckdb-wasm"
  - "node_modules/apache-arrow"
  - "node_modules/@duckdb/node-api"
  - "**/*.wasm"

mac:
  target: dmg
  icon: resources/icon.icns
  hardenedRuntime: true
  identity: null
  gatekeeperAssess: false
  category: public.app-category.business

win:
  target:
    - nsis
    - portable  # [ADD THIS] Generates a standalone .exe
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false # Install to AppData (No Admin rights needed)
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
