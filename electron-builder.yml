appId: com.wansan.studio
productName: Wansan Studio

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - public/**/*
  - node_modules/**/*

mac:
  category: public.app-category.business
  icon: icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: icon.png
  target:
    - target: AppImage
      arch:
        - x64
