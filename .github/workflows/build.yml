name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger only when pushing a tag like v1.0.1

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # [CRITICAL] Generate Icons Script
      # Since we don't commit generated icons to git, generate them on CI
      - name: Generate Icons
        run: node scripts/generate-icons.js
        # If your script requires 'png2icons', ensure it is in devDependencies

      - name: Typecheck
        run: npm run typecheck

      - name: Build Frontend
        run: npm run build

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force skip signing
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist_electron/*.dmg
            dist_electron/*.exe
            dist_electron/*.zip
          draft: true # Create a Draft Release for you to review
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
