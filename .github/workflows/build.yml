name: Build & Release

on:
  push:
    tags:
      - 'v*'      # 匹配 v1.0.0, v2.1.0 等
      - '!v*-*'   # 排除 v1.0.0-Alpha, v0.3.2-DeepSeek 等包含中划线的标签

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          # Force skip signing
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac:all

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run dist:win

      - name: Upload Artifacts to PUBLIC Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # [CRITICAL] Target the Public Repo
          repository: wansanai/wansan-releases
          token: ${{ secrets.RELEASE_TOKEN }} # Use PAT instead of GITHUB_TOKEN
          files: |
            dist_electron/*.dmg
            dist_electron/*.exe
          draft: false
          prerelease: true
